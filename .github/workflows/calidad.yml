name: Calidad

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Check, migraciones, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sgprod_ci
          POSTGRES_USER: sgprod
          POSTGRES_PASSWORD: sgprod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgprod -d sgprod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-no-es-un-secreto-real
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: sgprod_ci
      DB_USER: sgprod
      DB_PASSWORD: sgprod
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      TZ: America/Tijuana

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Revisión de Django
        run: python manage.py check

      - name: Migraciones aplican en una base limpia
        run: python manage.py migrate --noinput

      - name: Esquema y migraciones en sincronía
        run: python manage.py check_db

      - name: No hay migraciones pendientes por generar
        run: python manage.py makemigrations --check --dry-run

      - name: Lint
        run: ruff check .

      - name: Pruebas
        run: pytest -q
